<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雅思禅 | IELTS Zen Ultra</title>
    <meta name="description" content="A focused IELTS study companion with a weekly planner, notes, timer and sketchpad.">

    <!-- 引入 Tailwind CSS 并开启 Class 级别暗黑模式支持 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>

    <!-- 引入模块映射 (Import Map) -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",

        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js",

    </script>

    <script src="https://unpkg.com/@babel/standalone@7.28.5/babel.min.js"></script>
    <script src="./config.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 transition-colors duration-500">
    <noscript>请开启 JavaScript 以使用 IELTS Zen。</noscript>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { initializeApp } from 'firebase/app';
        import { getAuth, onAuthStateChanged, signInAnonymously } from 'firebase/auth';
        import { getFirestore, doc, onSnapshot, writeBatch } from 'firebase/firestore';
        import {
          Flame, LayoutDashboard, CalendarCheck, Edit3,
          X, Save, Trash2, Clock, CheckCircle2, Sparkles,
          Moon, Sun, Timer, Play, Pause, RotateCcw,
          CloudRain, Coffee, Waves, ChevronDown, ChevronUp, Smile
        } from 'lucide-react';

        import { STORAGE_KEY, emptyProgress, rolloverProgress, completionStreak, daysUntil, remainingSeconds } from './zen-core.js';

        // ==========================================
        // ⚠️ 部署配置区域
        // ==========================================
        const config = window.IELTS_ZEN_CONFIG || {};
        let auth = null;
        let db = null;
        let configError = '';
        if (config.firebase) {
          try {
            const app = initializeApp(config.firebase);
            auth = getAuth(app);
            db = getFirestore(app);
          } catch {
            configError = '云端配置无效，已使用本地模式。';
          }
        }

        function readStored(key, fallback) {
          try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
          catch { return fallback; }
        }
        const initialProgress = { ...emptyProgress(), ...readStored(STORAGE_KEY, {}) };

        // 静态数据：周计划任务库
        const WEEK_TASKS = [
          { dayId: 1, dayName: '星期一', en: 'Monday', tasks: [
            { id: 'mon_1', type: '词汇', color: 'bg-purple-100 text-purple-700 dark:bg-purple-900/40 dark:text-purple-300', text: '词汇拓展：结合语境，学习并背诵 60 个新单词。' },
            { id: 'mon_2', type: '听力', color: 'bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300', text: '听力实战：完成 1-2 套雅思听力真题，重点进行错题精听。' }
          ]},
          { dayId: 2, dayName: '星期二', en: 'Tuesday', tasks: [
            { id: 'tue_1', type: '词汇', color: 'bg-purple-100 text-purple-700 dark:bg-purple-900/40 dark:text-purple-300', text: '词汇复习：根据记忆曲线，复习并新背诵 60 个单词。' },
            { id: 'tue_2', type: '写作', color: 'bg-orange-100 text-orange-700 dark:bg-orange-900/40 dark:text-orange-300', text: '小作文 (Task 1)：练习图表描述，注意数据对比句型。' },
            { id: 'tue_3', type: '阅读', color: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300', text: '阅读练习：计时完成 1 个雅思阅读 Section，圈出长难句。' }
          ]},
          { dayId: 3, dayName: '星期三', en: 'Wednesday', tasks: [
            { id: 'wed_1', type: '听力', color: 'bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300', text: '专项提升：针对薄弱题型（如地图题、配对题）进行突破。' },
            { id: 'wed_2', type: '口语', color: 'bg-pink-100 text-pink-700 dark:bg-pink-900/40 dark:text-pink-300', text: '口语对练：与搭档进行 Part 1 & 2 模拟对话，录音并回顾。' }
          ]},
          { dayId: 4, dayName: '星期四', en: 'Thursday', tasks: [
            { id: 'thu_1', type: '词汇', color: 'bg-purple-100 text-purple-700 dark:bg-purple-900/40 dark:text-purple-300', text: '综合复习：盘点回顾本周前三天积累的所有生词。' },
            { id: 'thu_2', type: '写作', color: 'bg-orange-100 text-orange-700 dark:bg-orange-900/40 dark:text-orange-300', text: '大作文 (Task 2)：练习议论文写作，构建清晰逻辑框架。' }
          ]},
          { dayId: 5, dayName: '星期五', en: 'Friday', tasks: [
            { id: 'fri_1', type: '调整', color: 'bg-slate-200 text-slate-700 dark:bg-slate-700/50 dark:text-slate-300', text: '缓冲休息日：整理本周错题集，轻松翻阅笔记，为周末蓄力。' }
          ]},
          { dayId: 6, dayName: '星期六', en: 'Saturday', tasks: [
            { id: 'sat_1', type: '模拟', color: 'bg-rose-100 text-rose-700 dark:bg-rose-900/40 dark:text-rose-300', text: '全真模拟：自选一套完整真题（听、说、读、写）严格限时完成。' },
            { id: 'sat_2', type: '词汇', color: 'bg-purple-100 text-purple-700 dark:bg-purple-900/40 dark:text-purple-300', text: '周末巩固：背诵并默写本周核心错词 100 个，加深肌肉记忆。' }
          ]},
          { dayId: 7, dayName: '星期日', en: 'Sunday', tasks: [
            { id: 'sun_1', type: '复盘', color: 'bg-indigo-100 text-indigo-700 dark:bg-indigo-900/40 dark:text-indigo-300', text: '深度复盘：精读周六模考阅读错题，分析错因及同义替换。' },
            { id: 'sun_2', type: '词汇', color: 'bg-purple-100 text-purple-700 dark:bg-purple-900/40 dark:text-purple-300', text: '词汇冲刺：继续背单词，挑战进阶高频词汇 50 个。' }
          ]}
        ];

        const TOTAL_TASKS = WEEK_TASKS.reduce((acc, curr) => acc + curr.tasks.length, 0);
        const MOOD_EMOJIS = ['🤩', '😊', '😌', '😐', '😫', '🫠', '🤯'];

          const Sketchpad = ({ isDarkMode }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [ctx, setCtx] = useState(null);

            useEffect(() => {
              const canvas = canvasRef.current;
              if (canvas) {
                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width * dpr;
                // 扩展高度至 550px
                canvas.height = 550 * dpr;

                const context = canvas.getContext('2d');
                context.scale(dpr, dpr);
                context.lineCap = 'round';
                // 根据暗黑模式切换画笔颜色
                context.strokeStyle = isDarkMode ? '#a5b4fc' : '#4f46e5';
                context.lineWidth = 3;

                // 根据暗黑模式切换背景颜色
                context.fillStyle = isDarkMode ? '#1e293b' : '#ffffff';
                context.fillRect(0, 0, canvas.width, canvas.height);

                setCtx(context);
              }
            }, []);

            useEffect(() => { if (ctx) ctx.strokeStyle = isDarkMode ? '#a5b4fc' : '#4f46e5'; }, [ctx, isDarkMode]);

            const getCoordinates = (e) => {
              const canvas = canvasRef.current;
              const rect = canvas.getBoundingClientRect();
              if (e.touches && e.touches.length > 0) {
                return { offsetX: e.touches[0].clientX - rect.left, offsetY: e.touches[0].clientY - rect.top };
              }
              return { offsetX: e.nativeEvent.offsetX, offsetY: e.nativeEvent.offsetY };
            };

            const startDrawing = (e) => { if (!ctx) return; const { offsetX, offsetY } = getCoordinates(e); ctx.beginPath(); ctx.moveTo(offsetX, offsetY); setIsDrawing(true); };
            const draw = (e) => { if (!isDrawing || !ctx) return; e.preventDefault(); const { offsetX, offsetY } = getCoordinates(e); ctx.lineTo(offsetX, offsetY); ctx.stroke(); };
            const stopDrawing = () => { if (!ctx) return; ctx.closePath(); setIsDrawing(false); };
            const clearCanvas = () => { if (!ctx || !canvasRef.current) return; ctx.fillStyle = isDarkMode ? '#1e293b' : '#ffffff'; ctx.fillRect(0, 0, canvasRef.current.width, canvasRef.current.height); };
            const exportCanvas = () => { if (!canvasRef.current) return; const link = document.createElement('a'); link.download = 'ielts-zen-sketch.png'; link.href = canvasRef.current.toDataURL('image/png'); link.click(); };

            return (
              <div className="space-y-4 animate-[fadeIn_0.7s_ease-out]">
                <header>
                  <h1 className="text-2xl font-bold text-slate-800 dark:text-white">Zen Canvas</h1>
                  <p className="text-slate-500 dark:text-slate-400 text-sm">充足的书写空间，放飞你的思路。</p>
                </header>

                <div className="bg-white/80 dark:bg-slate-800 p-2 rounded-3xl shadow-2xl border border-slate-100 dark:border-slate-700 overflow-hidden touch-none relative">
                  <canvas
                    ref={canvasRef}
                    className="w-full h-[550px] cursor-crosshair rounded-2xl border border-dashed border-slate-200 dark:border-slate-600"
                    onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing}
                    onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing}
                  />
                  <div className="absolute bottom-6 right-6 flex gap-3">
                    <button aria-label="清空画布" onClick={clearCanvas} className="p-4 bg-white/90 dark:bg-slate-700/90 backdrop-blur rounded-2xl shadow-xl text-rose-500 hover:bg-rose-50 dark:hover:bg-slate-600 transition-transform active:scale-95 border border-slate-100 dark:border-slate-600">
                      <Trash2 size={24} />
                    </button>
                    <button aria-label="下载画布" onClick={exportCanvas} className="p-4 bg-indigo-600 rounded-2xl shadow-xl text-white hover:bg-indigo-700 transition-transform active:scale-95">
                      <Save size={24} />
                    </button>
                  </div>
                </div>
              </div>
            );
          };


        function App() {
          // 核心状态
          const [user, setUser] = useState(null);
          const [activeTab, setActiveTab] = useState('dashboard');
          const [canvasVisited, setCanvasVisited] = useState(false);
          const [isDarkMode, setIsDarkMode] = useState(() => readStored('ielts-zen-dark', false));
          const [syncStatus, setSyncStatus] = useState(configError || (auth ? '正在连接云端…' : '本地模式 · 数据保存在此浏览器'));
          const [storageError, setStorageError] = useState('');
          const [examDate, setExamDate] = useState(() => readStored('ielts-zen-exam', ''));
          const progressRef = useRef(initialProgress);
          const cloudReady = useRef(false);
          const cloudUser = useRef(null);
          cloudUser.current = user;
          const cloudWrites = useRef(Promise.resolve());
          const pendingArchives = useRef({});
          const rolloverInFlight = useRef(false);
          const timerDeadline = useRef(null);
          const aiRequest = useRef(null);

          // 学习数据状态
          const [taskStatus, setTaskStatus] = useState(initialProgress.taskStatus);
          const [notes, setNotes] = useState(initialProgress.notes);
          const [extraTasks, setExtraTasks] = useState(initialProgress.extraTasks);
          const [dailyMoods, setDailyMoods] = useState(initialProgress.dailyMoods);
          const [expandedDays, setExpandedDays] = useState({});
          const [streak, setStreak] = useState(initialProgress.streak);

          // UI 与 AI 交互状态
          const [noteModal, setNoteModal] = useState({ isOpen: false, taskId: null, text: '', taskType: '' });
          const [aiResponse, setAiResponse] = useState('');
          const [isAiLoading, setIsAiLoading] = useState(false);

          // 专注时钟状态
          const [timeLeft, setTimeLeft] = useState(25 * 60);
          const [isTimerRunning, setIsTimerRunning] = useState(false);
          const [timerMode, setTimerMode] = useState('work'); // work, break
          const [activeSound, setActiveSound] = useState(null);
          const audioRefs = useRef({});

          const applyProgress = (data) => {
            setTaskStatus(data.taskStatus || {}); setNotes(data.notes || {});
            setExtraTasks(data.extraTasks || {}); setDailyMoods(data.dailyMoods || {});
            setStreak(data.streak || 0);
          };

          const storeProgress = (data) => {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); setStorageError(''); }
            catch { setStorageError('浏览器无法保存数据，请使用下方按钮导出备份。'); }
          };

          const checkLocalWeek = () => {
            const { progress, archive } = rolloverProgress(progressRef.current);
            if (!archive) return;
            try {
              const archives = readStored('ielts-zen-archives', {});
              localStorage.setItem('ielts-zen-archives', JSON.stringify({ ...archives, [archive.weekId]: archive }));
            } catch { setStorageError('归档保存失败，本周数据已保留，请先导出备份。'); return; }
            progressRef.current = progress;
            pendingArchives.current[archive.weekId] = archive;
            storeProgress(progress);
            applyProgress(progress);
            if (cloudReady.current) syncToCloud({});
          };

          useEffect(() => {
            checkLocalWeek();
            const interval = setInterval(checkLocalWeek, 60000);
            return () => { clearInterval(interval); aiRequest.current?.abort(); };
          }, []);

          useEffect(() => {
            try {
              localStorage.setItem('ielts-zen-dark', JSON.stringify(isDarkMode));
              localStorage.setItem('ielts-zen-exam', JSON.stringify(examDate));
            } catch { setStorageError('浏览器无法保存设置，请检查存储权限。'); }
          }, [isDarkMode, examDate]);

          const exportProgress = () => {
            const blob = new Blob([JSON.stringify({ progress: progressRef.current, archives: readStored('ielts-zen-archives', {}) }, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url; link.download = 'ielts-zen-backup.json'; link.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
          };

          // --- 1. 认证与音频初始化 ---
          useEffect(() => {
            const initAuth = async () => {
              try {
                await signInAnonymously(auth);
              } catch (err) {
                setSyncStatus('云端登录失败 · 已保留本地数据，请检查 Firebase 配置');
              }
            };
            if (auth) initAuth();
            const unsubscribeAuth = auth ? onAuthStateChanged(auth, setUser) : () => {};

            // 初始化环境音
            audioRefs.current = {
                rain: new Audio('https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3?filename=heavy-rain-nature-sounds-8186.mp3'),
                cafe: new Audio('https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3?filename=cafe-background-noise-10-minutes-8014.mp3'),
                noise: new Audio('https://cdn.pixabay.com/download/audio/2022/03/15/audio_8e64593e7d.mp3?filename=white-noise-8117.mp3')
            };
            Object.values(audioRefs.current).forEach(audio => { audio.loop = true; audio.volume = 0.4; });

            return () => {
                unsubscribeAuth();
                Object.values(audioRefs.current).forEach(audio => { audio.pause(); audio.src = ''; });
            };
          }, []);

          // --- 2. 云端数据同步监听 ---
          useEffect(() => {
            if (!user) return;
            const dataRef = doc(db, 'users', user.uid, 'learningData', 'progress');
            const unsubscribeData = onSnapshot(dataRef, { includeMetadataChanges: true }, async (docSnap) => {
              // A missing cache entry is not evidence that the server document is absent.
              if (docSnap.metadata.fromCache || docSnap.metadata.hasPendingWrites) {
                setSyncStatus('等待云端确认 · 本地数据已保留');
                return;
              }
              if (rolloverInFlight.current) return;
              try {
                if (!docSnap.exists()) {
                  cloudReady.current = true;
                  await syncToCloud({});
                  return;
                }
                const { progress, archive } = rolloverProgress(docSnap.data());
                if (archive) {
                  rolloverInFlight.current = true;
                  const batch = writeBatch(db);
                  batch.set(doc(db, 'users', user.uid, 'archives', archive.weekId), archive);
                  batch.set(dataRef, progress);
                  await batch.commit();
                  rolloverInFlight.current = false;
                }
                // Retain locally saved edits made while offline; whole-document last write wins.
                if ((progressRef.current.updatedAt || 0) > (progress.updatedAt || 0)) {
                  cloudReady.current = true;
                  await syncToCloud({});
                } else {
                  progressRef.current = { ...emptyProgress(), ...progress };
                  storeProgress(progressRef.current);
                  applyProgress(progressRef.current);
                }
                cloudReady.current = true;
                setSyncStatus(docSnap.metadata.fromCache ? '云端缓存 · 本地数据已保存' : '云端已连接 · 当前浏览器匿名账户');
              } catch {
                rolloverInFlight.current = false;
                setSyncStatus('云同步失败 · 本地数据已保留，请检查网络与安全规则');
              }
            }, () => { cloudReady.current = false; setSyncStatus('云同步不可用 · 本地数据已保留'); });
            return () => { cloudReady.current = false; unsubscribeData(); };
          }, [user]);

          // Use a deadline so background-tab throttling does not extend the session.
          useEffect(() => {
            if (!isTimerRunning) return;
            timerDeadline.current = Date.now() + timeLeft * 1000;
            const tick = () => {
              const seconds = remainingSeconds(timerDeadline.current);
              setTimeLeft(seconds);
              if (seconds === 0) {
                setIsTimerRunning(false);
                setSyncStatus(timerMode === 'work' ? '专注结束，休息一下吧！' : '休息结束，可以开始下一轮专注。');
              }
            };
            const interval = setInterval(tick, 250);
            document.addEventListener('visibilitychange', tick);
            return () => { clearInterval(interval); document.removeEventListener('visibilitychange', tick); };
          }, [isTimerRunning, timerMode]);

          const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
          };

          const switchTimerMode = (mode) => {
            setTimerMode(mode);
            setIsTimerRunning(false);
            setTimeLeft(mode === 'work' ? 25 * 60 : 5 * 60);
          };

          const toggleSound = (soundType) => {
            if (activeSound === soundType) {
              audioRefs.current[soundType].pause();
              setActiveSound(null);
            } else {
              if (activeSound) audioRefs.current[activeSound].pause();
              setActiveSound(soundType);
              audioRefs.current[soundType].play().catch(() => {
                setActiveSound(current => current === soundType ? null : current);
                setSyncStatus('环境音加载失败，请检查网络或选择其他声音。');
              });
            }
          };

          // --- 4. 核心交互同步逻辑 ---
          const syncToCloud = async (newData) => {
            checkLocalWeek();
            const data = { ...progressRef.current, ...newData, updatedAt: Math.max(Date.now(), (progressRef.current.updatedAt || 0) + 1) };
            progressRef.current = data;
            storeProgress(data);
            const uid = cloudUser.current?.uid;
            if (!uid || !cloudReady.current) return;
            const archives = { ...pendingArchives.current };
            const write = async () => {
              setSyncStatus('正在同步 · 本地数据已保存');
              const batch = writeBatch(db);
              for (const [weekId, archive] of Object.entries(archives)) batch.set(doc(db, 'users', uid, 'archives', weekId), archive);
              batch.set(doc(db, 'users', uid, 'learningData', 'progress'), data);
              await batch.commit();
              for (const weekId of Object.keys(archives)) delete pendingArchives.current[weekId];
              setSyncStatus('云端已连接 · 当前浏览器匿名账户');
            };
            cloudWrites.current = cloudWrites.current.then(write).catch(() => setSyncStatus('云同步失败 · 本地数据已保留'));
            await cloudWrites.current;
          };

          const handleToggleTask = (taskId) => {
            checkLocalWeek();
            const data = progressRef.current;
            const currentStatus = data.taskStatus[taskId];
            const newStatus = !currentStatus ? 'completed' : currentStatus === 'completed' ? 'skipped' : null;
            const newTaskStatus = { ...data.taskStatus, [taskId]: newStatus };
            const streakUpdate = newStatus === 'completed' ? completionStreak(data.streak, data.lastActive) : {};
            setTaskStatus(newTaskStatus);
            if (streakUpdate.streak !== undefined) setStreak(streakUpdate.streak);
            syncToCloud({ taskStatus: newTaskStatus, ...streakUpdate });
          };

          const handleExtraTaskChange = (dayId, text) => {
            checkLocalWeek();
            const updated = { ...progressRef.current.extraTasks, [dayId]: text };
            setExtraTasks(updated);
            progressRef.current = { ...progressRef.current, extraTasks: updated, updatedAt: Math.max(Date.now(), (progressRef.current.updatedAt || 0) + 1) };
            storeProgress(progressRef.current);
          };
          const handleExtraTaskBlur = () => syncToCloud({});

          const handleMoodChange = (dayId, mood) => {
            checkLocalWeek();
            const newMoods = { ...progressRef.current.dailyMoods, [dayId]: mood };
            setDailyMoods(newMoods);
            syncToCloud({ dailyMoods: newMoods });
          };

          const toggleDayExpansion = (dayId) => {
            setExpandedDays(prev => ({ ...prev, [dayId]: !prev[dayId] }));
          };

          const saveNote = () => {
            if (!noteModal.taskId) return;
            checkLocalWeek();
            const newNotes = { ...progressRef.current.notes, [noteModal.taskId]: noteModal.text };
            setNotes(newNotes);
            syncToCloud({ notes: newNotes });
            closeNote();
          };

          // AI keys live on a server; the browser sends only the requested note.
          const fetchGeminiAdvice = async (noteText, taskType) => {
            if (!noteText.trim() || !config.aiEndpoint) return;
            aiRequest.current?.abort();
            const controller = new AbortController();
            aiRequest.current = controller;
            setIsAiLoading(true); setAiResponse('');
            try {
              const response = await fetch(config.aiEndpoint, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                signal: controller.signal,
                body: JSON.stringify({ note: noteText, taskType }),
              });
              const data = await response.json();
              if (!response.ok) throw new Error(data.error || 'AI 服务暂不可用');

                      <textarea
                        aria-label="学习笔记"
                        autoFocus
                        value={noteModal.text}
                        onChange={(e) => setNoteModal({ ...noteModal, text: e.target.value })}
                        placeholder="例如：今天听力 Section 3 的匹配题错太多了..."
                        className="w-full h-32 p-4 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-600 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none resize-none text-sm text-slate-700 dark:text-slate-300 placeholder-slate-400 transition-all"
                      />

                      <div className="flex justify-start mt-3 mb-2">
                        <button
                          onClick={() => fetchGeminiAdvice(noteModal.text, noteModal.taskType)}
                          disabled={!config.aiEndpoint || isAiLoading || !noteModal.text.trim()}
                          className="text-xs flex items-center gap-1.5 px-3 py-2 bg-purple-100 dark:bg-purple-900/40 text-purple-700 dark:text-purple-300 font-semibold rounded-lg transition-transform active:scale-95 disabled:opacity-50"
                        >
                          {isAiLoading ? <span className="animate-spin text-sm">⏳</span> : <Sparkles size={14} />}
                          {!config.aiEndpoint ? 'AI 导师未配置' : isAiLoading ? 'AI 导师正在为你思考...' :
                           noteModal.taskType === '词汇' ? '✨ AI 生成高分例句' :
                           noteModal.taskType === '写作' ? '✨ AI 拓展写作思路' : '✨ 获取 AI 导师建议'}
                        </button>
                      </div>

                      {aiResponse && (
                        <div className="mb-4 p-4 bg-indigo-50 dark:bg-indigo-900/30 border border-indigo-100 dark:border-indigo-800/50 rounded-xl text-sm text-indigo-800 dark:text-indigo-200 leading-relaxed animate-[fadeIn_0.3s_ease-out]">
                          <span className="font-bold flex items-center gap-1 mb-1 text-indigo-900 dark:text-indigo-300">
                            <Sparkles size={14} className="text-indigo-600 dark:text-indigo-400"/> 雅思名师点拨：
                          </span>
                          {aiResponse}
                        </div>
                      )}

                      <button onClick={saveNote} className="w-full mt-2 py-3.5 bg-indigo-600 dark:bg-indigo-500 text-white font-semibold rounded-2xl hover:bg-indigo-700 transition-transform active:scale-95 flex justify-center items-center gap-2 shadow-lg shadow-indigo-200 dark:shadow-none">
                        <Save size={18} /> 保存笔记
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
